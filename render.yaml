services:
  - type: web
    name: cerebrum-hotelops
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOTELOPS_FIXTURE_MODE
        value: "1"
      - key: HOTELOPS_LLM_PROVIDER
        value: fake
      - key: HOTELOPS_MARKET
        value: uae
      - key: DATABASE_URL
        fromDatabase:
          name: hotelops-pg
          property: connectionString
      - key: HOTELOPS_OPERATOR_TOKEN
        generateValue: true
      - key: HOTELOPS_REVIEWER_TOKEN
        generateValue: true

  - type: worker
    name: cerebrum-hotelops-worker
